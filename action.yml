name: leakwatch
description: Scan a repository and its git history for leaked API keys, passwords and other secrets.
author: Hamsa Hassan
branding:
  icon: shield
  color: red

inputs:
  path:
    description: Folder to scan.
    default: "."
  history:
    description: Scan every commit, not only the current files. Needs actions/checkout with fetch-depth 0.
    default: "false"
  fail-on:
    description: Lowest severity that fails the job (low, medium, high, critical).
    default: "low"
  sarif-file:
    description: Also write a SARIF report to this path, e.g. for github/codeql-action/upload-sarif.
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install leakwatch
      shell: bash
      run: pip install --quiet "${{ github.action_path }}"
    - name: Scan
      shell: bash
      env:
        LW_PATH: ${{ inputs.path }}
        LW_HISTORY: ${{ inputs.history }}
        LW_FAIL_ON: ${{ inputs.fail-on }}
        LW_SARIF: ${{ inputs.sarif-file }}
      run: |
        args=(scan "$LW_PATH" --fail-on "$LW_FAIL_ON")
        if [ "$LW_HISTORY" = "true" ]; then args+=(--history); fi
        if [ -n "$LW_SARIF" ]; then
          leakwatch "${args[@]}" --format sarif --output "$LW_SARIF" || true
        fi
        leakwatch "${args[@]}"
